<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network & CCTV Topology Map - Lantai 2</title>
    <!-- Tailwind CSS CDN for instant styling support -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                750: '#293548',
                850: '#151e2e',
                950: '#0b0f19'
              }
            }
          }
        }
      }
    </script>
    <style>
      @keyframes softPing {
        0% { transform: scale(1); opacity: 0.8; }
        75%, 100% { transform: scale(2.2); opacity: 0; }
      }
      .animate-ping-soft {
        animation: softPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
